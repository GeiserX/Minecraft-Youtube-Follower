<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#388E3C"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="white" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Pixelated game controller icon -->
  <g transform="translate(55, 60)" fill="url(#accent)">
    <!-- Controller body -->
    <rect x="0" y="20" width="80" height="40" rx="8" opacity="0.9"/>
    <!-- D-pad -->
    <rect x="14" y="28" width="6" height="22" rx="1" fill="white" opacity="0.8"/>
    <rect x="6" y="36" width="22" height="6" rx="1" fill="white" opacity="0.8"/>
    <!-- Buttons -->
    <circle cx="58" cy="34" r="4" fill="white" opacity="0.8"/>
    <circle cx="68" cy="42" r="4" fill="white" opacity="0.8"/>
    <!-- Camera lens on top -->
    <circle cx="40" cy="14" r="12" fill="white" opacity="0.15"/>
    <circle cx="40" cy="14" r="8" fill="white" opacity="0.25"/>
    <circle cx="40" cy="14" r="4" fill="white" opacity="0.4"/>
    <!-- Recording dot -->
    <circle cx="58" cy="10" r="3" fill="#F44336" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="200" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold" fill="white">Minecraft YouTube Follower</text>

  <!-- Subtitle -->
  <text x="200" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="white" opacity="0.7">24/7 automated server streaming with player following</text>

  <!-- Decorative pixels on the right -->
  <g opacity="0.12" fill="white">
    <rect x="780" y="30" width="16" height="16" rx="2"/>
    <rect x="800" y="30" width="16" height="16" rx="2"/>
    <rect x="820" y="30" width="16" height="16" rx="2"/>
    <rect x="790" y="50" width="16" height="16" rx="2"/>
    <rect x="810" y="50" width="16" height="16" rx="2"/>
    <rect x="800" y="70" width="16" height="16" rx="2"/>
    <rect x="820" y="70" width="16" height="16" rx="2"/>
    <rect x="780" y="130" width="16" height="16" rx="2"/>
    <rect x="810" y="140" width="16" height="16" rx="2"/>
    <rect x="830" y="120" width="16" height="16" rx="2"/>
    <rect x="840" y="140" width="16" height="16" rx="2"/>
    <rect x="850" y="160" width="16" height="16" rx="2"/>
  </g>

  <!-- Grass block decorative element -->
  <g transform="translate(760, 148)" opacity="0.15">
    <rect x="0" y="0" width="40" height="20" fill="#4CAF50"/>
    <rect x="0" y="20" width="40" height="30" fill="#8D6E63"/>
    <rect x="50" y="10" width="30" height="15" fill="#4CAF50"/>
    <rect x="50" y="25" width="30" height="25" fill="#8D6E63"/>
  </g>
</svg>
